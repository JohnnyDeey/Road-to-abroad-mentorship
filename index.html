<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Path Abroad</title>
<meta name="theme-color" content="#0d1b2a">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Path Abroad">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0d1b2a;--navy2:#1a2d42;--gold:#e8a020;--gold-soft:#fff6e0;
  --bg:#f5f0e8;--card:#fff;--ink:#1a1a2e;--muted:#6b7280;--line:#e5dfd2;
  --green:#1f9d55;--green-soft:#e6f6ec;--blue:#2563eb;--blue-soft:#e8f0fe;
  --red:#d64545;--red-soft:#fdecec;--amber:#a86a12;--amber-soft:#fff3d6;--grey-soft:#f1eee8;
  --nav-h:62px;--top-h:56px;--r:14px;
  --sat:var(--safe-area-inset-top,env(safe-area-inset-top,0px));--sab:var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px));
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;min-height:100vh}
body.noscroll{overflow:hidden}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit;text-align:inherit}
input,textarea,select{font:inherit;color:inherit}
a{color:var(--navy);font-weight:600;word-break:break-word}
h1,h2,h3,.serif{font-family:'Playfair Display',Georgia,serif;color:var(--navy)}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.ico.sm{width:15px;height:15px}
.ico.lg{width:23px;height:23px}
.grow{flex:1;min-width:0}
.mt{margin-top:12px}
.c{text-align:center;justify-content:center}
.muted,.sub{color:var(--muted)}
.sub{font-size:.8rem}
.one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* top bar */
.top{position:sticky;top:0;z-index:40;height:calc(var(--top-h) + var(--sat));padding-top:var(--sat)!important;background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;padding:0 10px 0 16px}
.brand{font-family:'Playfair Display',serif;font-weight:700;font-size:1.08rem;color:#fff}
.brand b{color:var(--gold)}
.brand-i{width:30px;height:30px;border-radius:8px;display:block;flex-shrink:0}
.logo-img{width:52px;height:52px;border-radius:14px;display:block;margin:0 auto}
.logo .logo-img{margin:0}
.brand.dark{color:var(--navy);font-size:1.5rem;font-weight:900}
.top .sp{flex:1}
.role-tag{font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:700;border:1px solid rgba(232,160,32,.4);padding:3px 8px;border-radius:99px}
.top-btn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:rgba(255,255,255,.8)}
.top-btn:active,.top-btn:hover{background:rgba(255,255,255,.08);color:#fff}

/* nav: bottom bar on phones, side rail on desktop */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:40;height:calc(var(--nav-h) + var(--sab));padding-bottom:var(--sab);background:#fff;border-top:1px solid var(--line);display:flex}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.68rem;font-weight:600;color:var(--muted);position:relative}
.nav button.on{color:var(--navy)}
.nav button.on .ico{stroke:var(--gold)}
.dot{position:absolute;top:7px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 5px;border-radius:99px;background:var(--red);color:#fff;font-size:.62rem;font-weight:700;display:grid;place-items:center;line-height:1}
.dot.static{position:static;display:inline-grid}
main{max-width:640px;margin:0 auto;padding:16px 14px calc(var(--nav-h) + 40px)}
main.wide{max-width:900px}
@media(min-width:900px){
  .nav{top:var(--top-h);bottom:0;right:auto;width:200px;height:auto;flex-direction:column;border-top:none;border-right:1px solid var(--line);padding:14px 10px}
  .nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:11px;padding:11px 12px;border-radius:10px;font-size:.88rem}
  .nav button.on{background:var(--gold-soft)}
  .nav .dot{position:static;margin-left:auto}
  .stage{margin-left:200px}
  main{padding:24px 24px 48px}
}

/* type */
.pg-t{font-size:1.55rem;font-weight:900}
.pg-s{color:var(--muted);font-size:.85rem;margin-top:2px}
.ey{font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700}
.sec-t{font-size:.7rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700;margin:24px 2px 9px;display:flex;align-items:center;gap:7px}
.sec-t .sp{flex:1}
.sec-t .sub{text-transform:none;letter-spacing:0;font-weight:500}
.hint{font-size:.8rem;color:var(--muted);margin:6px 0 2px}
.empty{padding:22px 10px;text-align:center;color:var(--muted);font-size:.86rem}

/* cards and controls */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:block;width:100%}
button.card{text-align:left}
button.card:active{transform:scale(.995)}
.stack>*+*{margin-top:9px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:10px;font-weight:600;font-size:.86rem;background:var(--navy);color:#fff;white-space:nowrap}
.btn.gold{background:var(--gold);color:var(--navy)}
.btn.ghost{background:var(--grey-soft);color:var(--navy)}
.btn.green{background:var(--green);color:#fff}
.btn.red{background:var(--red-soft);color:var(--red)}
.btn.sm{padding:6px 11px;font-size:.78rem;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{color:var(--muted);font-size:.8rem;text-decoration:underline;padding:6px}
.icon-btn{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--grey-soft);color:var(--red)}
.row-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
.fl{display:block;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--navy);margin:14px 0 6px}
.in{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;outline:none;font-size:.92rem;resize:vertical;transition:border-color .15s}
.in:focus{border-color:var(--gold)}
.in[readonly]{background:var(--grey-soft);color:#444}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:.7rem;font-weight:700;white-space:nowrap;line-height:1.3}
.chip.trk{background:var(--navy);color:var(--gold)}
.chip.msg{background:var(--navy);color:#fff}
.st-not_started{background:var(--grey-soft);color:var(--muted)}
.st-in_progress{background:var(--amber-soft);color:var(--amber)}
.st-submitted{background:var(--blue-soft);color:var(--blue)}
.st-revision{background:var(--red-soft);color:var(--red)}
.st-approved{background:var(--green-soft);color:var(--green)}
.bar{height:6px;border-radius:99px;background:var(--grey-soft);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .4s}
.bar.green i{background:var(--green)}
.av{width:40px;height:40px;border-radius:50%;background:var(--navy);color:var(--gold);display:grid;place-items:center;font-weight:700;flex-shrink:0}
.av.sm{width:30px;height:30px;font-size:.8rem}
.av.lg{width:52px;height:52px;font-size:1.2rem}
.nm{font-weight:700;color:var(--navy);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.flags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;align-items:center}
.flags .pct{margin-left:auto;font-weight:700;font-size:.8rem;color:var(--navy)}
.ring{--p:0;width:66px;height:66px;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--p)*1%),rgba(255,255,255,.14) 0);display:grid;place-items:center;flex-shrink:0}
.ring span{width:52px;height:52px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.9rem}
.ring.dark{background:conic-gradient(var(--gold) calc(var(--p)*1%),var(--grey-soft) 0);width:56px;height:56px}
.ring.dark span{width:44px;height:44px;background:#fff;color:var(--navy);font-size:.8rem}

/* student home */
.hero{background:var(--navy);color:#fff;border-radius:18px;padding:18px;position:relative;overflow:hidden}
.hero:after{content:'';position:absolute;right:-50px;bottom:-60px;width:170px;height:170px;border-radius:50%;border:28px solid rgba(232,160,32,.07);pointer-events:none}
.hero-row{display:flex;align-items:center;gap:14px;position:relative;z-index:1}
.hero h1{color:#fff;font-size:1.5rem;margin:3px 0 2px}
.hero p{color:rgba(255,255,255,.6);font-size:.84rem}
.mod-card .mc-top{display:flex;align-items:center;gap:12px}
.mnum{width:34px;height:34px;border-radius:10px;background:var(--navy);color:var(--gold);display:grid;place-items:center;font-weight:700;font-size:.9rem;flex-shrink:0}
.mod-card.locked{opacity:.6;background:transparent}
.mod-card.locked .mnum,.mp.locked .mnum{background:var(--grey-soft);color:var(--muted)}
.mod-card.done .mnum,.mp.done .mnum{background:var(--green);color:#fff}
.mod-card.overdue{border-color:#f2b8b8}
.mc-title{font-weight:700;color:var(--navy);display:block}
.mc-sub{font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:4px;margin-top:1px}
.mc-meta{display:flex;gap:12px;font-size:.78rem;color:var(--muted);margin-top:9px;align-items:center}
.mc-meta .go{margin-left:auto;color:var(--navy);font-weight:700;display:flex;align-items:center;gap:2px}
.road{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x mandatory;scrollbar-width:none}
.road::-webkit-scrollbar{display:none}
.road-i{min-width:124px;max-width:124px;scroll-snap-align:start;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}
.road-i .ri-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted)}
.road-i .mnum{width:26px;height:26px;font-size:.75rem;border-radius:8px}
.road-i .ri-t{font-size:.78rem;font-weight:700;color:var(--navy);margin-top:8px;line-height:1.3;min-height:2.6em}
.road-i .ri-d{font-size:.7rem;color:var(--muted);margin-top:3px}
.road-i.locked{opacity:.55}
.road-i.locked .mnum{background:var(--grey-soft);color:var(--muted)}
.road-i.done .mnum{background:var(--green);color:#fff}
.road-i.done .ri-top{color:var(--green)}
.road-i.current{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-soft)}
.road-i.overdue{border-color:var(--red)}
.road-i.overdue .ri-top{color:var(--red)}
.nudge{display:flex;gap:12px;align-items:center;background:var(--gold-soft);border-color:#f3d79a}

/* module page */
.back{display:inline-flex;align-items:center;gap:4px;font-size:.82rem;font-weight:700;color:var(--navy);padding:4px 0;margin-bottom:10px}
.mod-head{background:var(--navy);color:#fff;border-radius:18px;padding:18px}
.mod-head h1{color:#fff;font-size:1.4rem;margin:3px 0 4px}
.mod-head p{color:rgba(255,255,255,.65);font-size:.86rem}
.mod-head .mh-meta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px;font-size:.78rem;color:rgba(255,255,255,.7)}
.mod-head .mh-meta span{display:inline-flex;align-items:center;gap:4px}
.mod-head .bar{background:rgba(255,255,255,.14)}
details.card>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px}
details.card>summary::-webkit-details-marker{display:none}
.guide{margin-top:12px}
.guide summary{font-weight:700;color:var(--navy)}
.guide summary .chev{margin-left:auto;transition:transform .2s;color:var(--muted)}
.guide[open] summary .chev{transform:rotate(90deg)}
.guide p{font-size:.88rem;color:#3a3a4a;margin-top:10px}
.tips{margin:10px 0 0;padding:0;list-style:none}
.tips li{font-size:.85rem;color:#3a3a4a;padding:6px 0 6px 22px;position:relative;border-top:1px dashed var(--line)}
.tips li:before{content:'';position:absolute;left:4px;top:13px;width:7px;height:7px;border-radius:50%;background:var(--gold)}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.pill{display:inline-flex;align-items:center;gap:5px;background:var(--navy);color:#fff;padding:6px 11px;border-radius:99px;font-size:.75rem;text-decoration:none;font-weight:600}
.tpl{margin-top:12px;background:#f7f6fc;border:1px solid #dcd8f5;border-radius:10px;padding:12px;position:relative}
.tpl pre{white-space:pre-wrap;font-family:ui-monospace,Menlo,monospace;font-size:.74rem;line-height:1.7;color:#333;margin-top:6px}
.tpl .btn{position:absolute;top:8px;right:8px}
.tpl .ey{color:#7a72c4}
.task{display:flex;align-items:center;gap:11px;width:100%;padding:12px;background:#fff;border:1px solid var(--line);border-radius:12px}
.task:hover{border-color:#d9cfb8}
.tnum{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:.72rem;font-weight:700;flex-shrink:0}
.tt{flex:1;min-width:0;font-size:.88rem;color:var(--ink);line-height:1.4}
.tfb{display:flex;align-items:center;gap:4px;font-size:.72rem;color:var(--red);font-weight:700;margin-top:3px}
.task .chip{flex-shrink:0}
@media(max-width:420px){.task .chip{display:none}}

/* sheet */
.ov{position:fixed;inset:0;z-index:80;background:rgba(13,27,42,.55);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease}
.sheet{background:#fff;width:100%;max-width:600px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:8px 18px calc(22px + var(--sab));position:relative;animation:up .22s ease}
.grab{width:42px;height:4px;border-radius:99px;background:var(--line);margin:4px auto 12px}
.sh-x{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.sh-x:hover{background:var(--grey-soft)}
.sh-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;padding-right:36px}
.sheet h3{font-size:1.15rem;line-height:1.3}
.fb{background:var(--gold-soft);border-left:3px solid var(--gold);border-radius:0 10px 10px 0;padding:10px 12px;margin-top:14px;font-size:.86rem}
.fb-h{display:flex;align-items:center;gap:5px;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--amber);margin-bottom:4px}
.note{display:flex;gap:7px;align-items:flex-start;padding:10px 12px;border-radius:10px;font-size:.84rem;margin-top:12px}
.note.ok{background:var(--green-soft);color:var(--green)}
.note.info{background:var(--blue-soft);color:var(--blue)}
.answer{background:var(--grey-soft);border-radius:10px;padding:10px 12px;font-size:.88rem;white-space:pre-wrap;word-wrap:break-word}
.answer.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;margin-top:8px}
.meta{font-size:.74rem;color:var(--muted);margin-top:5px}
.links-out{margin-top:6px;font-size:.8rem;display:flex;flex-direction:column;gap:3px}
@media(min-width:900px){.ov{align-items:center}.sheet{border-radius:18px;max-height:86vh}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:0}}

/* mentor */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left}
.stat b{display:block;font-family:'Playfair Display',serif;font-size:1.5rem;color:var(--navy);line-height:1.1}
.stat span{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.stat.warn b{color:var(--red)}
.card.stu,.card.pend,.card.thr,.card.me{display:flex;gap:12px;align-items:flex-start}
.card.pend{align-items:center;background:var(--gold-soft);border-color:#f3d79a}
.card.thr{align-items:center}
.thr-r{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.stu .sub{margin-top:2px}
.stu .bar{margin-top:8px}
.rv-h{display:flex;gap:10px;align-items:center}
.rv-t{font-weight:600;font-size:.9rem;margin-top:10px;color:var(--navy)}
.stu-head{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.stu-head h1{font-size:1.35rem}
.seg{display:flex;gap:3px;background:#e9e3d6;padding:3px;border-radius:11px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;padding:8px 11px;border-radius:9px;font-size:.8rem;font-weight:700;color:var(--muted);white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:5px}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tabbody{margin-top:14px}
.tabbody>*+*{margin-top:9px}
.mp summary .mc-sub{display:block}
.mp[open]{padding-bottom:14px}
.qa{padding:10px 0;border-top:1px dashed var(--line)}
.qa:first-child{border-top:none;padding-top:0}
.qa dt{font-size:.74rem;font-weight:700;color:var(--muted)}
.qa dd{font-size:.9rem;margin-top:2px;white-space:pre-wrap}
.log .log-h{display:flex;align-items:center;gap:8px}
.log .log-h b{flex:1;color:var(--navy)}
.log p{font-size:.86rem;margin-top:6px;white-space:pre-wrap}
.log-a{display:flex;gap:5px;align-items:center;font-size:.8rem;font-weight:600;color:var(--amber);margin-top:8px}
.card.danger{border-color:#f2c4c4}

/* chat */
.thread{display:flex;flex-direction:column;gap:6px;padding-top:4px}
.bub{max-width:82%;padding:9px 12px;border-radius:16px;font-size:.9rem;white-space:pre-wrap;word-wrap:break-word}
.bub.me{align-self:flex-end;background:var(--navy);color:#fff;border-bottom-right-radius:5px}
.bub.me a{color:var(--gold)}
.bub.them{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:5px}
.bub time{display:block;font-size:.64rem;opacity:.55;margin-top:3px;text-align:right}
.bub .tl{display:block;font-size:.66rem;font-weight:700;opacity:.7;margin-bottom:2px}
.tc-list{display:flex;flex-direction:column;gap:8px}
.tc{background:var(--gold-soft);border-left:3px solid var(--gold);border-radius:0 10px 10px 0;padding:8px 12px;font-size:.88rem;white-space:pre-wrap;word-wrap:break-word}
.tc.me{background:var(--grey-soft);border-left-color:var(--navy)}
.tc-h{display:flex;justify-content:space-between;gap:8px;font-size:.72rem;color:var(--muted);margin-bottom:3px;white-space:normal}
.tc-h b{color:var(--navy)}
.composer{position:sticky;bottom:calc(var(--nav-h) + var(--sab));display:flex;gap:8px;align-items:flex-end;background:var(--bg);padding:10px 0 4px;margin-top:10px}
.composer textarea{resize:none;max-height:140px;border-radius:20px;padding:10px 14px}
.send{width:44px;height:44px;border-radius:50%;background:var(--gold);color:var(--navy);display:grid;place-items:center;flex-shrink:0}
@media(min-width:900px){.composer{bottom:0}}

/* auth */
.auth{min-height:100vh;background:var(--navy);display:grid;place-items:center;padding:20px}
.abox{background:#fff;border-radius:18px;padding:26px 22px;width:100%;max-width:360px}
.abox h2{font-size:1.3rem;margin-top:10px}
.logo{display:flex;align-items:center;justify-content:center;gap:10px}
.logo-i{width:44px;height:44px;border-radius:12px;background:var(--navy);color:var(--gold);display:grid;place-items:center;margin:0 auto}
.logo .logo-i{margin:0}
.abox .seg{margin-top:16px}
.abox.center{text-align:center}

/* toast + demo switcher */

.demo select{background:#2a2a2a;color:#fff;border:none;border-radius:99px;padding:5px 8px;font-size:.72rem}
@media(min-width:900px){.demo{bottom:14px}}
.center{text-align:center}
.err{color:var(--red);font-size:.82rem;margin-top:12px;line-height:1.4}

function ago(ts){if(!ts)return'';const s=(Date.now()-ts)/1000;if(s<60)return'now';if(s<3600)return Math.floor(s/60)+'m';if(s<86400)return Math.floor(s/3600)+'h';if(s<604800)return Math.floor(s/86400)+'d';return fmt(new Date(ts));}
function addMonths(d,n){const x=new Date(d),day=x.getDate();x.setMonth(x.getMonth()+n);if(x.getDate()<day)x.setDate(0);return x;}

function modStats(u,m){const mod=cur(u).modules[m-1],p=Store.tasks(u.uid),c={total:mod.tasks.length,approved:0,submitted:0,revision:0,in_progress:0};mod.tasks.forEach((_,k)=>{const s=(p[tid(m,k+1)]||{}).status;if(c[s]!=null)c[s]++;});c.done=c.approved===c.total;return c;}
function modState(u,m){if(m>(u.unlockedModule||1))return'locked';if(modStats(u,m).done)return'done';return iso(new Date())>iso(target(u,m))?'overdue':'current';}
function overall(u){let t=0,a=0;cur(u).modules.forEach((_,i)=>{const s=modStats(u,i+1);t+=s.total;a+=s.approved;});return{t,a,pct:pct(a,t)};}

// Applies a review to the cache and works out whether the next module opens.
function applyReview(uid,id,status,comment){
  const p=Store.tasks(uid),e=p[id]||(p[id]={});
  if(status!=='comment'){e.status=status;e.reviewedAt=Date.now();}
  e.mentorComment=comment||'';
  if(status!=='approved')return 0;
  const u=C.users[uid],m=+id.match(/^m(\d+)/)[1],N=cur(u).modules.length;
  if(m===(u.unlockedModule||1)&&modStats(u,m).done&&m<N){u.unlockedModule=m+1;return m+1;}
  return 0;
}

const MockWrites={

  review(uid,id,status,comment){const o=applyReview(uid,id,status,comment);emit();return o;},
  approveStudent(uid,track,startDate){Object.assign(C.users[uid],{status:'approved',track,startDate,unlockedModule:1});emit();},

};

// ── STORE: writes, live Firebase ───────────────────────────────────────
let fb=null,auth=null,db=null;
const marking=new Set();
const FireWrites={
  saveAnswer(uid,id,answer,status){
    const p=Store.tasks(uid),e=p[id]||(p[id]={});Object.assign(e,{answer,status});emit();
    const v={answer,status,updatedAt:fb.serverTimestamp()};if(status==='submitted')v.submittedAt=fb.serverTimestamp();
    fb.setDoc(fb.doc(db,'progress',uid,'tasks',id),v,{merge:true}).catch(fail);
  },
  review(uid,id,status,comment){
    const opened=applyReview(uid,id,status,comment);emit();
    const v={mentorComment:comment||''};if(status!=='comment'){v.status=status;v.reviewedAt=fb.serverTimestamp();}
    fb.setDoc(fb.doc(db,'progress',uid,'tasks',id),v,{merge:true}).catch(fail);
    if(opened)fb.updateDoc(fb.doc(db,'users',uid),{unlockedModule:opened}).catch(fail);
    return opened;
  },
  approveStudent(uid,track,startDate){
    const u=C.users[uid];
    fb.updateDoc(fb.doc(db,'users',uid),{status:'approved',track,startDate,unlockedModule:1}).then(()=>mailApproved(u.name,u.email)).catch(fail);
  },
  decline(uid){fb.deleteDoc(fb.doc(db,'users',uid)).catch(fail);},
  remove(uid){fb.updateDoc(fb.doc(db,'users',uid),{status:'deleted'}).catch(fail);},
  updateStudent(uid,patch){fb.updateDoc(fb.doc(db,'users',uid),patch).catch(fail);},
  saveProfile(uid,p){const u=C.users[uid];u.profile={...(u.profile||{}),...p};emit();fb.setDoc(fb.doc(db,'users',uid),{profile:u.profile},{merge:true}).catch(fail);},
  send(uid,from,body,task){const v={uid,from,body,at:fb.serverTimestamp(),read:false};if(task)v.task=task;fb.addDoc(fb.collection(db,'messages'),v).catch(fail);},
  markRead(uid,me,task){C.messages.forEach(m=>{if(m.uid===uid&&m.from!==me&&(task?m.task===task:!m.task)&&!m.read&&!marking.has(m.id)){marking.add(m.id);m.read=true;fb.updateDoc(fb.doc(db,'messages',m.id),{read:true}).catch(()=>marking.delete(m.id));}});},
  addLog(uid,x){fb.addDoc(fb.collection(db,'meetings',uid,'log'),x).catch(fail);},
  delLog(uid,id){fb.deleteDoc(fb.doc(db,'meetings',uid,'log',id)).catch(fail);}
};

function sMessages(u){return `<h2 class="pg-t">Messages</h2><p class="pg-s">Your conversation with your mentor</p>${threadView(u.uid,u.uid)}`;}
function sProfile(u){

    ${Q.map(q=>`<label class="fl" for="pq-${q.k}">${esc(q.q)}</label><textarea id="pq-${q.k}" class="in" rows="2" data-draft="pq:${q.k}">${esc(V.draft['pq:'+q.k]??P[q.k]??'')}</textarea>`).join('')}

// ── MENTOR SCREENS ─────────────────────────────────────────────────────
function mHome(){
  const pend=Store.pending(),stus=Store.students(),q=reviewQueue().length;
  const od=stus.filter(u=>modState(u,curModule(u))==='overdue').length,lg=DEMO?0:legacyCount();

  ${lg?`<div class="card nudge mt">${icon('alert','lg')}<div class="grow"><b>Data from the old app</b><div class="sub">${lg} item${lg>1?'s':''} (old task ticks, messages or students without a track) need importing into the new format.</div></div><button class="btn sm" data-a="migrate">Import</button></div>`:''}
  ${pend.length?`<div class="sec-t">${icon('bell','sm')} Waiting for approval</div><div class="stack">${pend.map(u=>`<div class="card pend"><div class="av">${esc(initial(u.name))}</div><div class="grow"><div class="nm">${esc(u.name)}</div><div class="sub">${esc(u.email)}${u.field?' · '+esc(u.field):''}</div></div><button class="btn sm" data-a="openApprove" data-uid="${u.uid}">Review</button></div>`).join('')}</div>`:''}
  <div class="stats"><div class="stat"><b>${stus.length}</b><span>Active</span></div><button class="stat" data-a="go" data-tab="review"><b>${q}</b><span>To review</span></button><div class="stat ${od?'warn':''}"><b>${od}</b><span>Overdue</span></div></div>
  <div class="sec-t">Active students</div>
  <div class="stack">${stus.length?stus.map(stuCard).join(''):'<div class="empty">No active students yet.</div>'}</div>`;
}
function stuCard(u){
  const c=cur(u),N=c.modules.length,n=curModule(u),s=modState(u,n),o=overall(u),sub=countStatus(u,'submitted'),rv=countStatus(u,'revision'),un=unreadFrom(u.uid);
  return `<button class="card stu" data-a="openStu" data-uid="${u.uid}"><div class="av">${esc(initial(u.name))}</div><div class="grow">
    <div class="nm">${esc(u.name)} <span class="chip trk">${esc(c.short)}</span></div>
    <div class="sub">Module ${n}/${N}: ${esc(c.modules[n-1].title)}</div>
    <div class="bar"><i style="width:${o.pct}%"></i></div>
    <div class="flags">${s==='overdue'?`<span class="chip st-revision">${icon('alert','sm')} Overdue</span>`:''}${sub?`<span class="chip st-submitted">${sub} to review</span>`:''}${rv?`<span class="chip st-in_progress">${rv} in revision</span>`:''}${un?`<span class="chip msg">${icon('chat','sm')} ${un}</span>`:''}<span class="pct">${o.pct}%</span></div>
  </div></button>`;
}
function mReview(){
  const q=reviewQueue();
  return `<h2 class="pg-t">Review</h2><p class="pg-s">${q.length?`${q.length} submission${q.length>1?'s':''} waiting, oldest first`:'Nothing waiting. All caught up.'}</p>
  <div class="stack mt">${q.map(r=>`<div class="card rv"><div class="rv-h"><div class="av sm">${esc(initial(r.u.name))}</div><div class="grow"><div class="nm">${esc(r.u.name)}</div><div class="sub">Module ${r.m} · Task ${r.k}${r.e.submittedAt?` · ${ago(r.e.submittedAt)==='now'?'just now':ago(r.e.submittedAt)+' ago'}`:''}</div></div></div>
    <div class="rv-t">${esc(r.t.t)}</div><div class="answer clamp">${r.e.answer?linkify(r.e.answer):'<span class="muted">No answer text</span>'}</div>
    <div class="row-btns"><button class="btn sm green" data-a="quickApprove" data-uid="${r.u.uid}" data-m="${r.m}" data-k="${r.k}">${icon('check','sm')} Approve</button><button class="btn sm ghost" data-a="openTask" data-uid="${r.u.uid}" data-m="${r.m}" data-k="${r.k}">${icon('pen','sm')} Open & comment</button></div></div>`).join('')}</div>`;
}
function mMessages(){
  const rows=Store.students().map(u=>{const th=Store.thread(u.uid).filter(m=>!m.task);return{u,last:th[th.length-1],un:unreadFrom(u.uid)};}).sort((a,b)=>(b.last?.at||0)-(a.last?.at||0));
  return `<h2 class="pg-t">Messages</h2>
  <div class="stack mt">${rows.length?rows.map(r=>`<button class="card thr" data-a="openStu" data-uid="${r.u.uid}" data-tab2="messages"><div class="av">${esc(initial(r.u.name))}</div><div class="grow"><div class="nm">${esc(r.u.name)}</div><div class="sub one">${r.last?esc((r.last.from==='MENTOR'?'You: ':'')+r.last.body):'No messages yet'}</div></div><div class="thr-r">${r.last?`<span class="sub">${ago(r.last.at)}</span>`:''}${r.un?`<span class="dot static">${r.un}</span>`:''}</div></button>`).join(''):'<div class="empty">No active students yet.</div>'}</div>
  <div class="sec-t">Broadcast</div>
  <div class="card"><textarea class="in" rows="3" data-draft="bc" placeholder="Message to every active student. {name} becomes each first name.">${esc(V.draft.bc||'')}</textarea><div class="row-btns"><button class="btn" data-a="broadcast">${icon('send','sm')} Send to all</button></div></div>`;
}
function mStudent(){
  const u=Store.user(V.stu);if(!u||u.status!=='approved'){V.stu=null;return mHome();}
  const c=cur(u),o=overall(u),un=unreadFrom(u.uid);
  const tabs=[['progress','Progress'],['profile','Profile'],['log','Log'],['messages','Messages'],['settings','Settings']];

  return `<button class="back" data-a="back">${icon('back','sm')} Students</button>
  <section class="stu-head"><div class="av lg">${esc(initial(u.name))}</div><div class="grow"><h1>${esc(u.name)}</h1><div class="sub">${esc(u.email)}</div><div class="flags"><span class="chip trk">${esc(c.short)}</span><span class="chip st-not_started">Started ${fmt(dt(u.startDate),true)}</span></div></div><div class="ring dark" style="--p:${o.pct}"><span>${o.pct}%</span></div></section>
  <div class="seg">${tabs.map(([id,l])=>`<button class="${V.stuTab===id?'on':''}" data-a="stuTab" data-t="${id}">${l}${id==='messages'&&un&&V.stuTab!=='messages'?`<span class="dot static">${un}</span>`:''}</button>`).join('')}</div>

function mProgress(u){
  const c=cur(u),cm=curModule(u);
  return c.modules.map((m,i)=>{const n=i+1,s=modState(u,n),st=modStats(u,n),key=`p:${u.uid}:${n}`,def=n===cm,open=def!==V.toggled.has(key);

      <div class="stack mt">${m.tasks.map((t,k)=>taskRow(u,n,k+1,t)).join('')}</div></details>`;}).join('');
}
function mProfile(u){
  const Q=PROFILE_Q[u.track]||PROFILE_Q.general,P=u.profile||{};
  return `<div class="card"><dl>
    <div class="qa"><dt>Signed up as</dt><dd>${esc(u.field||'Not given')}</dd></div>

  </dl></div>`;
}
function mLog(u){

    <div class="grid2"><div><label class="fl">Date</label><input type="date" class="in" data-draft="lgDate" value="${esc(D.lgDate||iso(new Date()))}"></div><div><label class="fl">Topic</label><input class="in" data-draft="lgTopic" value="${esc(D.lgTopic||'')}" placeholder="e.g. CV review call"></div></div>
    <label class="fl">Notes</label><textarea class="in" rows="3" data-draft="lgNotes">${esc(D.lgNotes||'')}</textarea>
    <div class="grid2"><div><label class="fl">Action for student</label><input class="in" data-draft="lgAction" value="${esc(D.lgAction||'')}"></div><div><label class="fl">Due</label><input type="date" class="in" data-draft="lgDue" value="${esc(D.lgDue||'')}"></div></div>
    <div class="row-btns"><button class="btn" data-a="addLog">${icon('plus','sm')} Add entry</button></div></div>
  ${list.length?list.map(x=>`<div class="card log"><div class="log-h"><b>${esc(x.topic||'Meeting')}</b><span class="sub">${x.date?fmt(dt(x.date),true):''}</span><button class="icon-btn" data-a="delLog" data-id="${x.id}" aria-label="Delete">${icon('x','sm')}</button></div>${x.notes?`<p>${linkify(x.notes)}</p>`:''}${x.action?`<div class="log-a">${icon('target','sm')} ${esc(x.action)}${x.due?` · due ${fmt(dt(x.due))}`:''}</div>`:''}</div>`).join(''):'<div class="empty">No meetings logged yet.</div>'}`;
}
function mSettings(u){
  const N=cur(u).modules.length,D=V.draft;
  return `<div class="card">
    <label class="fl" style="margin-top:0">Track</label><select class="in" data-draft="setTrack">${Object.entries(CURRICULA).map(([k,x])=>`<option value="${k}" ${(D.setTrack??u.track)===k?'selected':''}>${esc(x.name)}</option>`).join('')}</select>
    <p class="hint">Answers are stored by task number, so switching track after work has started mixes them up. Set it at approval.</p>
    <label class="fl">Start date</label><input type="date" class="in" data-draft="setStart" value="${esc(D.setStart??u.startDate)}">

    <label class="fl">Modules open</label><select class="in" data-draft="setUnlock">${Array.from({length:N},(_,i)=>`<option value="${i+1}" ${+(D.setUnlock??u.unlockedModule)===i+1?'selected':''}>Up to Module ${i+1}</option>`).join('')}</select>
    <p class="hint">Modules open by themselves when the previous one is fully approved. Use this only to override.</p>
    <div class="row-btns"><button class="btn" data-a="saveSettings">Save changes</button></div></div>

}

// ── SETTINGS TAB (mentor and students) ─────────────────────────────────
function settingsView(){

  <div class="sec-t">Security</div>
  ${Bio?bioCard():`<div class="card"><b>Fingerprint lock</b><p class="hint">${native?'Install the latest version of the app to use this.':'Available in the Android app.'}</p>${SHOW_APK?'<div class="row-btns" style="margin-top:8px"><a class="btn" href="/PathAbroad.apk">Install the Android app</a></div>':''}</div>`}

// ── SHEETS ─────────────────────────────────────────────────────────────
function taskComments(uid,id,e){
  const me=V.role==='mentor'?'MENTOR':V.uid,u=Store.user(uid);
  let list=Store.thread(uid).filter(x=>x.task===id);
  if(!list.length&&e.mentorComment)list=[{from:'MENTOR',body:e.mentorComment,at:e.reviewedAt}];
  Store.markRead(uid,me,id);
  const when=t=>t?fmt(new Date(t),true)+', '+new Date(t).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}):'';
  return `<label class="fl">Comments</label>${list.length?`<div class="tc-list">${list.map(x=>`<div class="tc ${x.from===me?'me':''}"><div class="tc-h"><b>${x.from==='MENTOR'?'Mentor':esc(first(u?.name))}</b><time>${when(x.at)}</time></div>${linkify(x.body)}</div>`).join('')}</div>`:'<p class="hint">No comments yet.</p>'}`;
}
function taskSheet(){
  const {uid,m,k}=V.sheet,u=Store.user(uid);if(!u)return '';
  const t=cur(u).modules[m-1].tasks[k-1],id=tid(m,k),e=Store.tasks(uid)[id]||{},s=e.status||'not_started',mentor=V.role==='mentor';
  let h=`<div class="sh-head"><span class="ey">Module ${m} · Task ${k}</span>${chip(s)}</div><h3>${esc(t.t)}</h3>${t.h?`<p class="hint">${esc(t.h)}</p>`:''}`;
  if(mentor){
    h+=`<label class="fl">${esc(first(u.name))}'s answer</label><div class="answer">${e.answer?linkify(e.answer):'<span class="muted">No answer yet</span>'}</div>${e.submittedAt?`<div class="meta">Submitted ${fmt(new Date(e.submittedAt),true)}</div>`:''}
    ${taskComments(uid,id,e)}
    <textarea id="fb" class="in mt" rows="3" data-draft="comment" placeholder="Write a comment for ${esc(first(u.name))}">${esc(V.draft.comment||'')}</textarea>
    <div class="row-btns"><button class="btn green" data-a="review" data-s="approved">${icon('check','sm')} Approve</button><button class="btn red" data-a="review" data-s="revision">${icon('undo','sm')} Needs revision</button><button class="btn ghost" data-a="review" data-s="comment">${icon('send','sm')} Send comment</button></div>`;
    return h;
  }
  const ro=s==='approved'||s==='submitted',ans=V.draft.answer??e.answer??'',lk=urls(e.answer);
  h+=`<label class="fl" for="ans">Your answer or link</label><textarea id="ans" class="in" rows="5" data-draft="answer" ${ro?'readonly':''} placeholder="Type your answer, or paste a Google Docs link">${esc(ans)}</textarea>`;
  if(ro&&lk.length)h+=`<div class="links-out">${lk.map(x=>`<a href="${esc(x)}" target="_blank" rel="noopener">${icon('link','sm')} Open link</a>`).join('')}</div>`;
  if(s==='approved')h+=`<div class="note ok">${icon('check','sm')}<span>Approved${e.reviewedAt?' on '+fmt(new Date(e.reviewedAt),true):''}.</span></div>`;
  else if(s==='submitted')h+=`<div class="note info">${icon('clock','sm')}<span>Waiting for your mentor's review.</span></div><div class="row-btns"><button class="btn ghost" data-a="withdraw">${icon('pen','sm')} Edit answer</button></div>`;
  else h+=`<div class="row-btns"><button class="btn ghost" data-a="saveTask">Save draft</button><button class="btn gold" data-a="submitTask">${icon('send','sm')} Submit for review</button></div>`;
  h+=`${taskComments(uid,id,e)}
  <textarea class="in mt" rows="2" data-draft="tcomment" placeholder="Reply to your mentor">${esc(V.draft.tcomment||'')}</textarea>
  <div class="row-btns"><button class="btn ghost" data-a="tSend">${icon('send','sm')} Send</button></div>`;
  return h;
}
function approveSheet(){
  const u=Store.user(V.sheet.uid);if(!u)return '';
  const trk=V.draft.track??guessTrack(u),sd=V.draft.start??iso(new Date());
  return `<div class="sh-head"><span class="ey">New student</span></div><h3>${esc(u.name)}</h3><p class="hint">${esc(u.email)}${u.field?' · '+esc(u.field):''}</p>
  <label class="fl" for="trk">Track</label><select id="trk" class="in" data-draft="track">${Object.entries(CURRICULA).map(([k,c])=>`<option value="${k}" ${k===trk?'selected':''}>${esc(c.name)}</option>`).join('')}</select>
  <label class="fl" for="sd">Start date</label><input id="sd" type="date" class="in" data-draft="start" value="${sd}">
  <p class="hint">Module 1 is due one month after the start date. Only Module 1 is open at first.</p>
  <div class="row-btns"><button class="btn green" data-a="confirmApprove">${icon('check','sm')} Approve</button><button class="btn red" data-a="decline">Decline</button></div>`;
}
function sheetHtml(){
  const inner=V.sheet.type==='task'?taskSheet():approveSheet();
  if(!inner){V.sheet=null;return '';}
  return `<div class="ov" data-a="closeSheetBg"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div><button class="sh-x" data-a="closeSheet" aria-label="Close">${icon('x')}</button>${inner}</div></div>`;
}

// ── AUTH SCREENS ───────────────────────────────────────────────────────

  if(V.locked&&V.screen==='app')return box(`<div class="center"><img class="logo-img" src="/icon-512.png" alt=""><h2>Locked</h2><p class="hint">Use your fingerprint or face to open Path Abroad.</p><div class="row-btns c"><button class="btn gold" data-a="unlock">Unlock</button></div><button class="link" data-a="bioPassword">Use password instead</button></div>`);

  if(V.screen==='config')return box(`<div class="center"><div class="logo-i">${icon('alert','lg')}</div><h2>Firebase not configured</h2><p class="hint">Paste your Firebase config into FIREBASE_CONFIG at the top of the script, or open this page with ?demo to use sample data.</p></div>`);

  const su=V.screen==='signup',D=V.draft;

  <div class="seg"><button class="${su?'':'on'}" data-a="authTab" data-t="login">Sign in</button><button class="${su?'on':''}" data-a="authTab" data-t="signup">Sign up</button></div>
  ${su?`<label class="fl" for="a-nm">Full name</label><input id="a-nm" class="in" autocomplete="name" data-draft="aName" value="${esc(D.aName||'')}"><label class="fl" for="a-fd">Course or field</label><input id="a-fd" class="in" data-draft="aField" value="${esc(D.aField||'')}" placeholder="e.g. Nursing, Civil Engineering">`:''}
  <label class="fl" for="a-em">Email</label><input id="a-em" class="in" type="email" autocomplete="email" data-draft="aEmail" value="${esc(D.aEmail||'')}">
  <label class="fl" for="a-pw">Password</label><input id="a-pw" class="in" type="password" autocomplete="${su?'new-password':'current-password'}" data-draft="aPw" value="${esc(D.aPw||'')}">

// ── RENDER ─────────────────────────────────────────────────────────────
function body(){
  if(V.role==='mentor'){if(V.stu)return mStudent();return({home:mHome,review:mReview,messages:mMessages,settings:settingsView}[V.tab]||mHome)();}
  const u=Store.user(V.uid);
  if(V.tab==='modules'&&V.mod)return sModule(u,V.mod);
  return({home:sHome,modules:sModules,messages:sMessages,profile:sProfile,settings:settingsView}[V.tab]||sHome)(u);
}
function render(){
  const app=$('#app');
  if(V.screen==='app'&&V.locked&&!V.bioAsked){V.bioAsked=true;setTimeout(bioUnlock,300);}
  if(V.screen!=='app'||V.locked||(V.role==='student'&&!Store.user(V.uid))){app.innerHTML=authScreen();document.body.classList.remove('noscroll');syncDemo();return;}

let subs=[],stuSubs={},studentDataOn=false,creatingDoc=false;

// Firestore Timestamps become plain milliseconds so the screens stay simple.
function norm(d){const x=d.data({serverTimestamps:'estimate'})||{};for(const k in x){if(x[k]&&typeof x[k].toMillis==='function')x[k]=x[k].toMillis();}return x;}
function normUser(d){
  const u={uid:d.id,...norm(d)};
  if(u.role==='student'&&u.status==='approved'){
    if(!u.track){u._legacy=true;u.track='general';}
    if(!u.startDate)u.startDate=iso(u.createdAt?new Date(u.createdAt):new Date());
    if(!u.unlockedModule)u.unlockedModule=1;
  }
  return u;
}
// Messages from the old app have senderUid/recipientUid/subject instead of uid/from.
function normMsg(d){
  const x={id:d.id,...norm(d)};
  if(!x.uid){
    if(!x.senderUid)return null;
    x._legacy=true;x.uid=x.senderUid==='MENTOR'?x.recipientUid:x.senderUid;x.from=x.senderUid;
    x.body=(x.subject&&!/^re:/i.test(x.subject)?x.subject+'\n\n':'')+(x.body||'');x.at=x.createdAt;
  }
  return x;
}
function startMentor(){

function syncStudentSubs(){

  ];});

function startStudent(user){
  const uid=user.uid;
  subs.push(fb.onSnapshot(fb.doc(db,'users',uid),s=>{

function routeStudent(user){
  if(V.signingUp)return; // the sign-up flow finishes writing the doc first
  const uid=user.uid,u=C.users[uid];
  if(!u){
    // Signed in but no user doc (old account). Create a pending one.
    // Checks the server first so it never overwrites a doc the sign-up flow just wrote.
    if(!creatingDoc){creatingDoc=true;fb.getDoc(fb.doc(db,'users',uid)).then(s=>{if(!s.exists())return fb.setDoc(fb.doc(db,'users',uid),{email:user.email,name:user.email,field:'',role:'student',status:'pending',createdAt:fb.serverTimestamp()});}).catch(fail);}
    V.screen='pending';emit();return;
  }
  if(u.status==='deleted'){V.authErr='This account has been removed. Sign up again to request access.';fb.signOut(auth);return;}
  if(u.status==='approved'){
    if(!studentDataOn){studentDataOn=true;
      subs.push(fb.onSnapshot(fb.collection(db,'progress',uid,'tasks'),s=>{const o={};s.forEach(d=>{o[d.id]=norm(d);});C.progress[uid]=o;emit();},e=>console.error('progress',e)));
      subs.push(fb.onSnapshot(fb.query(fb.collection(db,'messages'),fb.where('uid','==',uid)),s=>{C.messages=s.docs.map(normMsg).filter(Boolean);emit();},e=>console.error('messages',e)));
    }
    if(V.screen!=='app'){V.screen='app';V.tab='home';V.mod=null;}
  }else V.screen='pending';
  emit();
}
function aerr(c){
  return ({'auth/user-not-found':'Email or password is incorrect.','auth/invalid-credential':'Email or password is incorrect.','auth/wrong-password':'Password is incorrect.','auth/invalid-email':'Please enter a valid email address.','auth/email-already-in-use':'This email is already registered. Try signing in.','auth/weak-password':'Password must be at least 6 characters.','auth/too-many-requests':'Too many attempts. Wait a few minutes and try again.','auth/network-request-failed':'No connection. Check your internet and try again.'})[c]||'Something went wrong. Please try again.';
}
async function liveLogin(){
  const em=(V.draft.aEmail||'').trim(),pw=V.draft.aPw||'';
  if(!em||!pw){V.authErr='Enter your email and password.';return;}
  V.busy=true;V.authErr='';V.locked=false;render();
  try{await fb.signInWithEmailAndPassword(auth,em,pw);V.draft={};}
  catch(e){V.authErr=aerr(e.code);}
  finally{V.busy=false;render();}
  return 'skip';
}
async function liveSignup(){
  const nm=(V.draft.aName||'').trim(),fd=(V.draft.aField||'').trim(),em=(V.draft.aEmail||'').trim(),pw=V.draft.aPw||'';
  if(!nm){V.authErr='Please enter your full name.';return;}
  if(!em){V.authErr='Please enter your email address.';return;}
  if(pw.length<6){V.authErr='Password must be at least 6 characters.';return;}
  V.busy=true;V.authErr='';V.signingUp=true;V.locked=false;render();
  const shape=()=>({email:em,name:nm,field:fd,role:'student',status:'pending',createdAt:fb.serverTimestamp()});
  let user=null;
  try{
    const c=await fb.createUserWithEmailAndPassword(auth,em,pw);user=c.user;
    await fb.setDoc(fb.doc(db,'users',user.uid),shape());mailNewStudent(nm,em);
  }catch(e){
    if(e.code==='auth/email-already-in-use'){
      try{
        const c2=await fb.signInWithEmailAndPassword(auth,em,pw);user=c2.user;
        const s=await fb.getDoc(fb.doc(db,'users',user.uid));
        if(!s.exists()||s.data().status==='deleted'){await fb.setDoc(fb.doc(db,'users',user.uid),shape());mailNewStudent(nm,em);}
        else if(s.data().status!=='pending'){V.authErr='This email is already registered. Use Sign in.';}
      }catch(e2){V.authErr=(e2.code==='auth/wrong-password'||e2.code==='auth/invalid-credential')?'This email already has an account. Use your original password, or reset it from Sign in.':aerr(e2.code);}
    }else V.authErr=aerr(e.code);
  }finally{
    V.signingUp=false;V.busy=false;
    if(V.authErr&&!user)render();
    else if(V.authErr){V.screen='signup';fb.signOut(auth);}
    else{V.draft={};if(auth.currentUser)routeStudent(auth.currentUser);}
  }
  return 'skip';
}
async function liveReset(){
  const em=(V.draft.aEmail||'').trim();
  if(!em){V.authErr='Enter your email above first.';render();return 'skip';}
  try{await fb.sendPasswordResetEmail(auth,em);V.authErr='';toast('Reset email sent. Check spam too.');}
  catch(e){V.authErr=e.code==='auth/user-not-found'?'No account found with that email.':'Could not send the reset email.';}
  render();return 'skip';
}

// ── ONE-TIME IMPORT FROM THE OLD APP ───────────────────────────────────
// Old task ids t1..t31 map onto the General track in the same order.
const OLD_MAP=(()=>{const m={},g=[8,7,6,5,2,3];let n=1;g.forEach((c,i)=>{for(let k=1;k<=c;k++)m['t'+(n++)]=tid(i+1,k);});return m;})();
function legacyCount(){
  let n=C.messages.filter(m=>m._legacy).length;
  Store.students().forEach(u=>{if(u._legacy)n++;const p=C.progress[u.uid]||{};Object.keys(p).forEach(id=>{if(OLD_MAP[id]&&!p[OLD_MAP[id]]&&(p[id].done||p[id].note))n++;});});
  return n;
}
async function migrate(){
  if(!confirm('Import old data?\n\n• Old task ticks become "Submitted" in the General track, so they land in your Review queue.\n• Old notes become answers. Your feedback is kept.\n• Old messages move into the new chat threads.\n• Students without a track get General.\n\nOld records are left in place, not deleted.'))return;
  const ops=[];
  Store.students().forEach(u=>{
    const p=C.progress[u.uid]||{};
    Object.keys(p).forEach(id=>{
      const to=OLD_MAP[id],o=p[id];if(!to||p[to]||!(o.done||o.note))return;
      const v={answer:o.note||'',status:o.done?'submitted':'in_progress',updatedAt:fb.serverTimestamp()};
      if(o.done)v.submittedAt=o.updatedAt?fb.Timestamp.fromMillis(o.updatedAt):fb.serverTimestamp();
      if(o.mentorComment)v.mentorComment=o.mentorComment;
      ops.push(b=>b.set(fb.doc(db,'progress',u.uid,'tasks',to),v,{merge:true}));
    });
    if(u._legacy)ops.push(b=>b.update(fb.doc(db,'users',u.uid),{track:'general',startDate:u.startDate,unlockedModule:1}));
  });
  C.messages.filter(m=>m._legacy).forEach(m=>ops.push(b=>b.update(fb.doc(db,'messages',m.id),{uid:m.uid,from:m.from,body:m.body,at:m.at?fb.Timestamp.fromMillis(m.at):fb.serverTimestamp()})));
  if(!ops.length){toast('Nothing to import');return;}
  try{
    for(let i=0;i<ops.length;i+=400){const b=fb.writeBatch(db);ops.slice(i,i+400).forEach(f=>f(b));await b.commit();}
    toast(`Imported ${ops.length} item${ops.length>1?'s':''}`);
  }catch(e){fail(e);}
}

// ── FINGERPRINT / FACE LOCK (Android app only) ─────────────────────────
// Firebase keeps the user signed in; this lock asks for biometrics when the
// app opens or returns after 15 minutes away. Opt-in per phone.
const Bio=window.Capacitor?.Plugins?.NativeBiometric;
const BIO_KEY='pa_bio_lock';
function bioOn(){try{return localStorage.getItem(BIO_KEY)==='1';}catch(e){return false;}}
function bioSet(v){try{v?localStorage.setItem(BIO_KEY,'1'):localStorage.removeItem(BIO_KEY);}catch(e){}}
let bioBusy=false,hiddenAt=0,bioEndedAt=0;
async function bioAvailable(){if(!Bio)return false;try{const r=await Bio.isAvailable();return !!(r&&r.isAvailable);}catch(e){return false;}}
async function bioVerify(reason){
  if(!Bio||bioBusy)return false;bioBusy=true;
  try{await Bio.verifyIdentity({reason,title:'Path Abroad',subtitle:reason});return true;}
  catch(e){return false;}
  finally{bioBusy=false;bioEndedAt=Date.now();}
}
async function bioUnlock(){if(await bioVerify('Unlock Path Abroad')){V.locked=false;render();}}
V.locked=!!Bio&&bioOn();V.bioAsked=false;
if(Bio&&CapApp){
  CapApp.addListener('appStateChange',({isActive})=>{
    // The fingerprint dialog itself pauses and resumes the app, so ignore those.
    if(bioBusy||Date.now()-bioEndedAt<3000){hiddenAt=0;return;}
    if(!isActive){hiddenAt=Date.now();return;}
    const away=hiddenAt?Date.now()-hiddenAt:0;hiddenAt=0;
    if(bioOn()&&V.screen==='app'&&!V.locked&&away>15*60*1000){V.locked=true;V.bioAsked=false;V.sheet=null;render();}
  });
}
function bioCard(){
  if(!Bio)return '';
  const on=bioOn();
  return `<div class="card mt"><b>Fingerprint lock</b><p class="hint">${on?'On. The app asks for your fingerprint or face when it opens.':'Ask for your fingerprint or face each time the app opens.'}</p><div class="row-btns" style="margin-top:8px"><button class="btn ${on?'ghost':''}" data-a="bioToggle">${on?'Turn off':'Turn on'}</button></div></div>`;
}
// ── PUSH NOTIFICATIONS (Android app only) ──────────────────────────────
// After sign-in: ask permission, register with FCM, save the token on the
// user's doc (fcmTokens.android). The Cloud Functions send to that token.
const Push=window.Capacitor?.Plugins?.PushNotifications;
let pushReady=false;
async function setupPush(uid){
  if(!Push||!uid)return;
  try{
    if(!pushReady){
      pushReady=true;
      Push.addListener('registration',t=>{const u=auth?.currentUser;if(u&&t.value)fb.setDoc(fb.doc(db,'users',u.uid),{fcmTokens:{android:t.value}},{merge:true}).catch(e=>console.warn('push token',e));});
      Push.addListener('registrationError',e=>console.warn('push register',e));
      Push.addListener('pushNotificationReceived',n=>toast(n.title||'New notification'));
      Push.addListener('pushNotificationActionPerformed',a=>openFromPush((a.notification&&a.notification.data)||{}));
    }
    let p=await Push.checkPermissions();
    if(p.receive==='prompt'||p.receive==='prompt-with-rationale')p=await Push.requestPermissions();
    if(p.receive==='granted')await Push.register();
  }catch(e){console.warn('push',e);}
}
// Tapping a notification opens the matching screen.
function openFromPush(d){
  V.sheet=null;V.draft={};
  const m=/^m(\d+)t(\d+)$/.exec(d.task||'');
  if(V.role==='mentor'){
    if(d.uid&&Store.user(d.uid)){V.stu=d.uid;V.stuTab=d.type==='message'?'messages':'progress';if(m&&d.type!=='message')V.sheet={type:'task',uid:d.uid,m:+m[1],k:+m[2]};}
    else V.tab=d.type==='submitted'?'review':'home';
  }else{
    V.stu=null;
    if(d.type==='message'){V.tab='messages';V.scrollBottom=true;}
    else if(m){V.tab='modules';V.mod=+m[1];V.sheet={type:'task',uid:V.uid,m:+m[1],k:+m[2]};}
    else V.tab='home';
  }
  render();
}

// ── APP UPDATE BANNER (Android app only) ───────────────────────────────
// Compares the installed app version with /version.json (written by deploy.bat).
const APK_URL='https://github.com/JohnnyDeey/Road-to-abroad-mentorship/raw/main/PathAbroad.apk';
function newer(a,b){const x=String(a).split('.').map(Number),y=String(b).split('.').map(Number);for(let i=0;i<3;i++){if((x[i]||0)!==(y[i]||0))return (x[i]||0)>(y[i]||0);}return false;}
async function checkAppUpdate(){
  if(!CapApp||!CapApp.getInfo)return;
  try{
    const info=await CapApp.getInfo();
    const latest=(await (await fetch('/version.json',{cache:'no-store'})).json()).android;
    if(latest&&newer(latest,info.version)){V.update={from:info.version,to:latest};render();}
  }catch(e){console.warn('update check',e);}
}
function updateBanner(){
  if(!V.update)return '';
  return `<div class="card nudge" style="margin-bottom:12px">${icon('bell','lg')}<div class="grow"><b>New version ${esc(V.update.to)} available</b><div class="sub">You have ${esc(V.update.from)}. Download and install it to get the latest features.</div></div><a class="btn sm" href="${APK_URL}">Update</a></div>`;
}

// ── START ──────────────────────────────────────────────────────────────
if(DEMO){
  loadSample();mountDemo();render();
}else if(!FIREBASE_CONFIG.apiKey){
  V.screen='config';render();
}else{
  render();registerSW();checkAppUpdate();
  const V10='https://www.gstatic.com/firebasejs/10.12.0/';
  const [appM,authM,fsM]=await Promise.all([import(V10+'firebase-app.js'),import(V10+'firebase-auth.js'),import(V10+'firebase-firestore.js')]);
  fb={...appM,...authM,...fsM};
  const app=fb.initializeApp(FIREBASE_CONFIG);
  auth=fb.getAuth(app);db=fb.getFirestore(app);
  if(window.emailjs&&EMAILJS.publicKey)window.emailjs.init({publicKey:EMAILJS.publicKey});
  fb.onAuthStateChanged(auth,user=>{
    stopAll();
    if(!user){V.role='student';V.uid=null;if(V.screen!=='signup')V.screen='login';V.sheet=null;render();return;}
    V.authErr='';
    if(user.uid===MENTOR_UID){setRole('mentor');startMentor();render();setupPush(user.uid);return;}
    V.role='student';V.uid=user.uid;V.tab='home';V.mod=null;V.sheet=null;
    if(!V.signingUp)V.screen='loading';
    render();startStudent(user);setupPush(user.uid);
  });
}
</script>
